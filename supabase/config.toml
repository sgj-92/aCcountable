# Minimal Supabase CLI config. Run `supabase link --project-ref <ref>` to connect
# this folder to your hosted project; unset options use the CLI defaults.
project_id = "accountable"

[functions.analyze-food]
verify_jwt = true

[functions.food-search]
verify_jwt = true

[functions.plan-day]
verify_jwt = true

[functions.parse-day-types]
verify_jwt = true

# Ledger calls this with an HMAC signature instead of a user token; the app calls it signed in.
[functions.ledger-sync]
verify_jwt = false
