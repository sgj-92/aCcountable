# Ship every push to the app on iOS and Android (runs on GitHub's free minutes, not Expo's).
#
# If a build with this code's native fingerprint already exists, publish an
# over-the-air update to the "production" branch, which installed copies
# download on their next launch. If native code changed (new native library,
# app.json native config, icons), start a new build instead: iOS goes to
# TestFlight; Android is an installable APK (download link on expo.dev).
# The website (accountable-app.expo.app) is rebuilt and published every time.
#
# Needs one repository secret: EXPO_TOKEN (an Expo access token).

name: Deploy to production

on:
  push:
    branches: ['claude/keen-sagan-zqk0hi', 'main']
  workflow_dispatch:

concurrency:
  group: eas-deploy
  cancel-in-progress: false

jobs:
  # Database changes and server functions go first, so the app never runs ahead of them.
  # Skipped (successfully) until the SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD secrets are added.
  supabase:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: lubouzocrluaojfjaqjy
    steps:
      - uses: actions/checkout@v4
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != ''

      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != ''
        with:
          version: 3.2.0

      - name: Apply database migrations
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != ''
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Deploy server functions
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != ''
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api --yes

      - name: Supabase secrets not set
        if: env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_DB_PASSWORD == ''
        run: echo "::warning::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD to deploy database changes and functions automatically."

  deploy:
    needs: supabase
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the Expo token is set
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an Expo access token as the repository secret EXPO_TOKEN."
            exit 1
          fi

      - run: npm ci

      # ── iOS ──
      - name: iOS fingerprint
        id: fp
        run: |
          hash=$(npx expo-updates fingerprint:generate --platform ios | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).hash))')
          echo "iOS fingerprint: $hash"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Look for an iOS build with this fingerprint
        id: build
        run: |
          count=$(npx --yes eas-cli@latest build:list --platform ios --build-profile production \
            --fingerprint-hash "${{ steps.fp.outputs.hash }}" --limit 10 --json --non-interactive \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const b=JSON.parse(s);console.log(b.filter(x=>!["ERRORED","CANCELED"].includes(String(x.status).toUpperCase())).length)})')
          echo "Matching iOS builds: $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Publish iOS over-the-air update
        if: steps.build.outputs.count != '0'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          msg=$(printf '%s' "${COMMIT_MESSAGE:-Manual run}" | head -n 1 | cut -c1-200)
          npx --yes eas-cli@latest update --branch production --platform ios --environment production \
            --message "$msg" --non-interactive

      - name: Start a new App Store build (iOS native code changed)
        if: steps.build.outputs.count == '0'
        run: |
          npx --yes eas-cli@latest build --platform ios --profile production --auto-submit \
            --non-interactive --no-wait

      # ── Android (installable APK, same production channel) ──
      - name: Android fingerprint
        id: fpa
        run: |
          hash=$(npx expo-updates fingerprint:generate --platform android | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).hash))')
          echo "Android fingerprint: $hash"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Look for an Android build with this fingerprint
        id: builda
        run: |
          count=$(npx --yes eas-cli@latest build:list --platform android --build-profile android-apk \
            --fingerprint-hash "${{ steps.fpa.outputs.hash }}" --limit 10 --json --non-interactive \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const b=JSON.parse(s);console.log(b.filter(x=>!["ERRORED","CANCELED"].includes(String(x.status).toUpperCase())).length)})')
          echo "Matching Android builds: $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Publish Android over-the-air update
        if: steps.builda.outputs.count != '0'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          msg=$(printf '%s' "${COMMIT_MESSAGE:-Manual run}" | head -n 1 | cut -c1-200)
          npx --yes eas-cli@latest update --branch production --platform android --environment production \
            --message "$msg" --non-interactive

      - name: Start a new Android APK build (Android native code changed)
        if: steps.builda.outputs.count == '0'
        run: |
          npx --yes eas-cli@latest build --platform android --profile android-apk \
            --non-interactive --no-wait

      # Builds listen on the "production" channel: make sure it points at the production branch.
      - name: Link production channel
        if: steps.build.outputs.count != '0' || steps.builda.outputs.count != '0'
        run: npx --yes eas-cli@latest channel:edit production --branch production --non-interactive

      # The website, https://accountable-app.expo.app: the same app built for the browser.
      # Its Supabase address and publishable key come from the Expo "production" environment.
      - name: Build the website
        run: |
          npx --yes eas-cli@latest env:pull --environment production --non-interactive
          npx expo export --platform web

      - name: Publish the website
        run: npx --yes eas-cli@latest deploy --prod --non-interactive --dev-domain accountable-app
