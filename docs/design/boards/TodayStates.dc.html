<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today · states and spec</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 2268px; height: 1160px; box-sizing: border-box; padding: 48px; background: {{c.board}}; color: {{c.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">
<header style="display: flex; align-items: flex-end; justify-content: space-between; height: 56px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 1px; color: {{c.accentText}}">TAB · TODAY</span>
<h1 style="margin: 0; font-family: Archivo, sans-serif; font-size: 32px; line-height: 36px; font-weight: 800; letter-spacing: -0.5px">Today</h1>
</div>
<span style="font-size: 13px; line-height: 18px; color: {{c.text2}}">{{themeName}} · Hybrid layout. Under / on / over target are on the Today · directions page (Hybrid, Tweaks → dayState).</span>
</header>
<div style="display: flex; gap: 40px; align-items: flex-start">
<sc-for list="{{phones}}" as="p" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 12px; width: 393px">
<div style="width: 393px; height: 852px; border-radius: 48px; overflow: hidden; position: relative; outline: 1px solid {{p.edge}}">
<dc-import name="TodayH" theme="{{p.theme}}" day-state="{{p.state}}" show-fold="{{p.fold}}" hint-size="393px,2300px"></dc-import>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; line-height: 18px; font-weight: 600">{{p.name}}</span>
<span style="font-size: 12px; line-height: 17px; color: {{p.muted}}">{{p.desc}}</span>
</div>
</div>
</sc-for>
<section aria-label="Spec" style="width: 400px; border-radius: 24px; background: {{c.surface}}; box-shadow: {{c.shadow}}; padding: 20px 24px; box-sizing: border-box; max-height: 920px; overflow: hidden; display: flex; flex-direction: column">
<h2 style="margin: 0 0 8px; font-size: 17px; line-height: 22px; font-weight: 700">Spec</h2>
<sc-for list="{{spec}}" as="s" hint-placeholder-count="16">
<div style="border-top: 1px solid {{s.line}}; padding: 7px 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 13px; line-height: 17px; font-weight: 600">{{s.k}}</span>
<span style="font-size: 12px; line-height: 16px; color: {{s.muted}}">{{s.d}}</span>
</div>
</sc-for>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":2268,"height":1160}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme === 'light' ? 'light' : 'dark';
    const P = {
      dark: { board: '#050604', surface: '#161814', line: '#2A2D27', text: '#F2F4EC', text2: '#A9AD9F', accentText: '#C6F24E', phoneEdge: '#2A2D27', shadow: 'none' },
      light: { board: '#E4E6DE', surface: '#FFFFFF', line: '#DADDD2', text: '#11130E', text2: '#55594E', accentText: '#476B00', phoneEdge: '#CFD2C7', shadow: '0 1px 3px rgba(17,19,14,0.07)' }
    };
    const c = P[theme];
    const ph = (state, name, desc) => ({ state, name, desc, theme, fold: false, edge: c.phoneEdge, muted: c.text2 });
    const phones = [
      ph('loading', 'Loading · first open', 'Skeleton for the very first fetch only. Header, dock and tab bar are live straight away.'),
      ph('fresh', 'New day · rest day, fasting', 'Fri 20: empty ring, “0 rest day” in the ledger, fasting countdown, nudge to weigh in.'),
      ph('over', 'Over target', 'Ring, number and unit turn red with “kcal over”. The alert sorts to the top.'),
      ph('past', 'Another day', 'Tue 17 via ‹: closed under target in good, ↩ Today chip, fasting hidden.')
    ];
    const S = (k, d) => ({ k, d, line: c.line, muted: c.text2 });
    const spec = [
      S('Screen', 'ScrollView · padding 62 / 16 / 200 (clears dock + tab bar) · automaticallyAdjustContentInsets · refresh spinner only while pulling.'),
      S('DayHeader', 'footnote 13/600 text2 + largeTitle 34/41 · IconButton 44 circle raised ‹ › · “↩ Today” chip 32 pill goodBg when not today · swipe hero ← → to change day (cross-fade 180 ms).'),
      S('HeroCard', 'Card r24 · pad 16/16/14 · gap 12 · centred. One card answers today and the week.'),
      S('CRing', '208 pt · stroke 16 · r 96 · 270° arc, rotate 45° (gap faces right like the C) · track · trainingSeg = training ÷ target at the arc end · fill accentLine → alert when over · centre num.hero 52/56, unit 15/600, sub 13.'),
      S('TargetLedger', '4-col grid · num.s 17/22 + caption 12 · base · training (training colour, “0 rest day” in text3) · week balance (signed −/+) · target with left hairline.'),
      S('MacroBars', '3-col gap 14 · label 12/600 + “117 left” 12/600 (alert “+25 over”) · ProgressBar 6 r3 · value num 14/18.'),
      S('WeekStrip', 'Link → /week · 7 cols gap 4 · bar 10×36 r5 · target tick 2 pt · past pastFill, over alert, today accentLine, future dashed 1.5 · viewed day raised r10 · summary 13 + warn dot.'),
      S('InsightsCard', 'r24 · rows pad 10 · icon 32 tinted, shape per level · title 15/600 · detail 13 · action 14/600 › · max 5, alert > warn > info > good. Week projection lives in WeekStrip.'),
      S('FastingBar', 'r20 pad 12/16 · open: accentText “Eating window · 3h 46m left · until 20:00” · fasting: info “14h 05m fasted · opens 12:00” · bar 6 · ticks every minute.'),
      S('Tiles 2-up', 'gap 12 · r22 pad 14 · Training: session + StatusPill, or “Rest day” + dashed “+ Session” · Weight: trend / not logged today (info) / logged (good) + sparkline 140×26.'),
      S('MealCard', 'r20 · header min 52: name 17/600, total num 15, AddButton 44 (32 visual) · FoodRow pad 10, photo glyph 14 · swipe left = Delete.'),
      S('QuickDock', 'absolute · left/right 16 · bottom = insets.bottom + 62 + 12 (top 692 on 852) · h 66 pad 7 r33 e2 · Scan meal flex 1.4 h52 accent → /scan · Add food flex 1 → /food · “+” 52 → native menu: Log session, Weigh in.'),
      S('Tab bar', 'NativeTabs (system) · Today = c.circle / c.circle.fill · Plan, Week, Profile as on the Brand board.'),
      S('Loading', 'Only when no cached day exists · skeleton blocks in raised · opacity 0.55 ↔ 1, 900 ms, withRepeat · ring track drawn at once · no spinner.'),
      S('Motion', 'Ring 700 ms out-cubic from the previous value · count-up 600 ms · crossing target: interpolateColor 240 ms + one warning haptic · insights FadeInDown 220 + 40 stagger · week bars grow 500 ms, 30 stagger · press scale 0.97.'),
      S('Another day', '› enabled · past under target shows “kcal under” in good · fasting hidden · dock and + Add log to the viewed day (sheet title carries that date).'),
      S('Accessibility', 'Ring label “1,781 kcal left of 2,301” · numbers maxFontSizeMultiplier 1.3 · all targets ≥ 44 · colour never alone: icon shapes + the words “over / under / left”.')
    ];
    return { c, phones, spec, themeName: theme === 'light' ? 'Light' : 'Dark' };
  }
}
</script>
</body>
</html>
